; =============================================================================
; LA_FastImport v1.2 - settings
; =============================================================================
; Kurz: mit den mitgelieferten Werten muss nichts geaendert werden.
; In short: with the shipped values nothing needs to be changed.
;
; Where:  next to LA_FastImport.dll in Gothic II\System\Autorun\,
;         else LA_FastImport.ini in Gothic II\System\.
; When:   read once at game start.
; Values: 1 = on, 0 = off. Invalid values -> default.
; =============================================================================

[LA_FASTIMPORT]

; Enabled - plugin on/off. 0 = Gothic runs exactly as without the plugin.
; Default: 1
Enabled=1

; FastVertexCache - the vertex merge cache (zCMesh::s_vertexCache) of 3DS import
; and BSP compile is kept in a blocked list instead of one sorted array.
; Same order, same search, same results; inserting no longer moves the whole array.
; Default: 1
FastVertexCache=1

; ReuseMergeCache - during the BSP compile ("BSP: Adding Polys To Bsp-Mesh") the
; engine rebuilds the cache of the whole, growing BSP mesh for every level mesh.
; With 1 the cache of the previous step is kept and only the new vertices are
; added. Checked on every step (vertex pointers and positions); on any difference
; the full rebuild runs. Needs FastVertexCache=1.
; Default: 1
ReuseMergeCache=1

; FastMergeRemap - MergeMesh finds each polygon vertex in the source mesh with a
; linear search; with 1 a hash table is used (same result).
; Default: 1
FastMergeRemap=1

; AllowBigBsp - Gothic shows a fault dialog ("BSP: SAVEBIN/LOADBIN: problem")
; when the compiled world mesh + BSP chunk is larger than 90,000,000 bytes.
; It is only a message: the data is written and read field by field with
; 32-bit sizes (fine up to 2 GB). With 1 the dialog is skipped in both places.
; Default: 1
AllowBigBsp=1

; SelfCheck - test switch: every reused cache is compared with a full rebuild
; (slow, only for checking). A difference is logged and the rebuild is used.
; Default: 0
SelfCheck=0

; Diag - 1 = write LA_FastImport.log next to the DLL (load line, code check,
; one line per MergeMesh with time and cache reuse, summary at exit).
; Default: 0
Diag=0

; DiagMaxLines - at most this many log lines per game start.
; Default: 2000
DiagMaxLines=2000
